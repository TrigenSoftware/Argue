name: Tests
on:
  pull_request:
  push:
    branches:
      - master
jobs:
  types:
    runs-on: ubuntu-latest
    name: types
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install
      - name: Check types
        run: pnpm test:types
  unit:
    runs-on: ubuntu-latest
    name: unit (${{ matrix.node-version || '.tool-versions' }})
    strategy:
      matrix:
        # The least Node.js the packages declare, and the one the repository is developed on
        include:
          - node-version: 22
          - node-version-file: .tool-versions
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          node-version-file: ${{ matrix.node-version-file }}
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install
      - name: Run tests
        run: pnpm test
      # One upload per commit, from the leg of the version the repository is developed on
      - name: Collect coverage
        uses: codecov/codecov-action@v7
        if: success() && matrix.node-version-file
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
